name: Build

on:
  push:
  workflow_dispatch:

env:
  JUCE_VERSION: 8.0.8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64 -DCHORDGEN_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse "build/ChordGen_artefacts/Release/VST3/ChordGen.vst3" pkg/
          Copy-Item -Recurse "build/ChordGenFX_artefacts/Release/VST3/ChordGen FX.vst3" pkg/
          Copy-Item "build/ChordGen_artefacts/Release/Standalone/ChordGen.exe" pkg/
          Copy-Item "build/ChordGenFX_artefacts/Release/Standalone/ChordGen FX.exe" pkg/
          Compress-Archive -Path pkg/* -DestinationPath ChordGen-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChordGen-Windows
          path: ChordGen-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCHORDGEN_COPY_PLUGIN=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir pkg
          cp -R build/ChordGen_artefacts/Release/VST3/ChordGen.vst3 pkg/
          cp -R "build/ChordGenFX_artefacts/Release/VST3/ChordGen FX.vst3" pkg/
          cp -R build/ChordGen_artefacts/Release/Standalone/ChordGen.app pkg/
          cp -R "build/ChordGenFX_artefacts/Release/Standalone/ChordGen FX.app" pkg/
          ditto -c -k pkg ChordGen-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChordGen-macOS
          path: ChordGen-macOS.zip
